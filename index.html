<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YG-Market</title>

<style>
body{
    margin:0;
    font-family:Tahoma,sans-serif;
    background:#121212;
    color:white;
}

header{
    background:#1f1f1f;
    text-align:center;
    padding:20px;
}

.logo{
    font-size:35px;
    color:#00ff88;
    font-weight:bold;
}

.games{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}

.card{
    background:#1e1e1e;
    width:250px;
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.card img{
    width:100%;
    border-radius:10px;
}

.price{
    color:#00ff88;
    font-size:22px;
    margin:10px 0;
}

.btn{
    display:inline-block;
    background:#00ff88;
    color:black;
    text-decoration:none;
    padding:10px 20px;
    border-radius:8px;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:20px;
    background:#1f1f1f;
}
</style>
</head>

<body>

<header>
    <div class="logo">YG-Market 🎮</div>
    <p>أفضل أسعار الألعاب والحسابات</p>
</header>

<section class="games">

<div class="card">
    <img src="https://via.placeholder.com/250x140" alt="GTA V">
    <h2>GTA V</h2>
    <div class="price">610 جنيه</div>
    <a href="#" class="btn">شراء</a>
</div>

<div class="card">
    <img src="https://via.placeholder.com/250x140" alt="Minecraft">
    <h2>Minecraft</h2>
    <div class="price">550 جنيه</div>
    <a href="#" class="btn">شراء</a>
</div>

<div class="card">
    <img src="https://via.placeholder.com/250x140" alt="Red Dead Redemption 2">
    <h2>Red Dead Redemption 2</h2>
    <div class="price">595 جنيه</div>
    <a href="#" class="btn">شراء</a>
</div>

</section>

<footer>
    © 2026 YG-Market - جميع الحقوق محفوظة
</footer>

</body>
</html>

<body>

<header>

    <input type="text" id="search" placeholder="ابحث عن لعبة...">
</header>

<div class="cart">
    🛒 السلة: <span id="cart-count">0</span>
</div>

<section class="products" id="products"></section>

<script src="script.js"></script>
</body>
</html>
